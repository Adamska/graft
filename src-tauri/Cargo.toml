[package]
name = "graft"
version = "0.1.0"
description = "Native Git client with an AST structural diff engine"
license = "MIT"
edition = "2021"

[lib]
name = "graft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
gix = { version = "0.90", default-features = false, features = ["blob-diff", "index", "max-performance", "revision", "sha1", "status"] }
rayon = "1.12.0"
smallvec = "1.16.6"
memory-stats = "1.2.0"
tree-sitter = "0.27.2"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
similar = "3.2.1"
ureq = { version = "3", features = ["json"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
